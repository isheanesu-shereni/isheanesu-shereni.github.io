<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainfall Data Map</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize OpenLayers map
        var map = new ol.Map({
            target: 'map', // The target HTML element
            layers: [
                // Google Maps base layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://mt0.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
                        attributions: 'Map data &copy; <a href="https://www.google.com/permissions/geoguidelines/">Google</a>'
                    })
                }),
                // GEE Rainfall Classification Tile Layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://earthengine.googleapis.com/v1/projects/remotesensing0924/maps/e82e4595e8c3c289d6cea5ddaafa8f87-415d952b997f1989e48602372ee31735/maps/tiles/{z}/{x}/{y}",
                        crossOrigin: 'anonymous'
                    }),
                    opacity: 0.6 // Adjust opacity for transparency
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([31.15, -17.6]), // Coordinates for center of map
                zoom: 8, // Initial zoom level
                minZoom: 7, // Set a minimum zoom level to avoid excessive zoom out
                maxZoom: 10  // Set a maximum zoom level to prevent zooming too far in
            })
        });

        // Ensure zoom restrictions work
        map.on('moveend', function() {
            var currentZoom = map.getView().getZoom();
            if (currentZoom < 7) {
                map.getView().setZoom(7);  // Enforce minimum zoom
            } else if (currentZoom > 10) {
                map.getView().setZoom(10);  // Enforce maximum zoom
            }
        });
    </script>
</body>
</html>
