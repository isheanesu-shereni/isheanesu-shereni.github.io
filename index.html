<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainfall Data Map</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .legend {
            background: white;
            padding: 10px;
            font-size: 12px;
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 999;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
</head>
<body>
    <div id="map"></div>
    <div class="legend">
        <strong>Rainfall Intensity (mm)</strong><br>
        <div style="background-color: #ff0000; width: 20px; height: 20px; display: inline-block;"></div> 0-25<br>
        <div style="background-color: #ff9900; width: 20px; height: 20px; display: inline-block;"></div> 26-50<br>
        <div style="background-color: #ffff00; width: 20px; height: 20px; display: inline-block;"></div> 51-75<br>
        <div style="background-color: #00ccff; width: 20px; height: 20px; display: inline-block;"></div> 76-100<br>
        <div style="background-color: #0000ff; width: 20px; height: 20px; display: inline-block;"></div> >100<br>
    </div>
    <script>
        // Initialize OpenLayers map
        var map = new ol.Map({
            target: 'map', // The target HTML element
            layers: [
                // Google Maps base layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://mt0.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
                        attributions: 'Map data &copy; <a href="https://www.google.com/permissions/geoguidelines/">Google</a>'
                    })
                }),
                // GEE Rainfall Classification Tile Layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://earthengine.googleapis.com/v1/projects/remotesensing0924/maps/e82e4595e8c3c289d6cea5ddaafa8f87-415d952b997f1989e48602372ee31735/maps/tiles/{z}/{x}/{y}",
                        crossOrigin: 'anonymous'
                    }),
                    opacity: 0.6 // Adjust opacity for transparency
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([31.15, -17.6]), // Coordinates for center of map
                zoom: 7, // Initial zoom level (around 2km)
                minZoom: 7, // Minimum zoom level (around 2km)
                maxZoom: 14, // Maximum zoom level (around 500m)
                resolution: 10, // Adjust resolution for 500m zoom level
                extent: ol.proj.transformExtent([31.000000, -17.700000, 31.300000, -17.500000], 'EPSG:4326', 'EPSG:3857')
            })
        });

        // Ensure zoom restrictions work
        map.on('moveend', function() {
            var currentZoom = map.getView().getZoom();
            if (currentZoom < 7) {
                map.getView().setZoom(7);  // Enforce minimum zoom (around 2km)
            } else if (currentZoom > 14) {
                map.getView().setZoom(14);  // Enforce maximum zoom (around 500m)
            }
        });

        // Adjust the zoom level to approximate 500 meters
        map.getView().on('change:resolution', function() {
            var resolution = map.getView().getResolution();
            if (resolution < 1000) { // Resolution equivalent to around 500m
                map.getView().setZoom(14); // 500m zoom level approx.
            }
        });
    </script>
</body>
</html>
