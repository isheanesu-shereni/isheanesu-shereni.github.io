<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainfall Data Map</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #dynamicMap {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://unpkg.com/ol@6.6.1/dist/ol.js"></script>
</head>
<body>
    <div id="dynamicMap"></div>
    <script>
        var dynamicMap = new ol.Map({
            target: 'dynamicMap',
            layers: [
                // Google Maps Base Layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://mt0.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
                        attributions: 'Map data &copy; <a href="https://www.google.com/permissions/geoguidelines/">Google</a>'
                    })
                }),
                // CHIRPS Dynamic Rainfall Layer
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://earthengine.googleapis.com/v1/projects/remotesensing0924/maps/e82e4595e8c3c289d6cea5ddaafa8f87-415d952b997f1989e48602372ee31735/maps//tiles/{z}/{x}/{y}",
                        crossOrigin: 'anonymous',
                        tileLoadFunction: function(imageTile, src) {
                            // Add logging to check the URLs for tiles
                            console.log('Tile URL:', src);
                            imageTile.getImage().src = src; // Set the tile image source
                        }
                    }),
                    opacity: 0.5 // Adjust opacity for transparency
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([31.15, -17.6]), // Adjusted to your AOI
                zoom: 8,  // Default zoom level
                maxZoom: 12  // Set a maximum zoom level
            })
        });
    </script>
</body>
</html>
